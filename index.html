<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Pro Web</title>
  
  <meta name="theme-color" content="#09090b">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' } },
          backgroundImage: {
            'chat-pattern': "url('data:image/svg+xml,%3Csvg width=\\'20\\' height=\\'20\\' viewBox=\\'0 0 20 20\\' xmlns=\\'http://www.w3.org/2000/svg\\'%3E%3Cg fill=\\'%2318181b\\' fill-opacity=\\'1\\' fill-rule=\\'evenodd\\'%3E%3Ccircle cx=\\'3\\' cy=\\'3\\' r=\\'3\\'/%3E%3Ccircle cx=\\'13\\' cy=\\'13\\' r=\\'3\\'/%3E%3C/g%3E%3C/svg%3E')"
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .glass-panel { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(16px); }
    .msg-enter { animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform-origin: bottom; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(15px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    
    /* Анимации для модальных окон */
    .modal-enter { animation: modalFadeIn 0.2s ease-out forwards; }
    .modal-exit { animation: modalFadeOut 0.2s ease-in forwards; pointer-events: none; }
    @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes modalFadeOut { from { opacity: 1; transform: scale(1) translateY(0); } to { opacity: 0; transform: scale(0.95) translateY(10px); } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-[100dvh] flex overflow-hidden select-none antialiased relative">

  <!-- Затемнение для мобильного меню -->
  <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden transition-opacity"></div>

  <!-- Боковое меню (Sidebar) -->
  <aside id="sidebar" class="absolute md:relative w-85 md:w-96 bg-zinc-900 border-r border-zinc-800/80 flex flex-col h-full z-30 shrink-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
    <div class="p-4 flex items-center justify-between glass-panel border-b border-zinc-800/80 sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <button id="close-sidebar-btn" class="md:hidden p-2 -ml-2 rounded-full text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1 class="font-bold text-xl tracking-tight bg-gradient-to-r from-brand-400 to-purple-500 bg-clip-text text-transparent">Nexus Pro</h1>
      </div>
      <div class="flex items-center gap-2">
        <!-- Кнопка "Добавить друга" -->
        <button onclick="openModal('add-friend-modal')" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-brand-400 flex items-center justify-center transition shadow-sm hover:shadow-brand-500/20">
          <i class="fa-solid fa-user-plus text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Поиск -->
    <div class="px-3 py-3 border-b border-zinc-800/50">
      <div class="relative group">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-zinc-500 text-sm group-focus-within:text-brand-400 transition-colors"></i>
        <input type="text" placeholder="Поиск чатов..." class="w-full bg-zinc-950/50 text-sm text-zinc-200 pl-9 pr-4 py-2 rounded-xl border border-zinc-800 focus:outline-none focus:border-brand-500/50">
      </div>
    </div>

    <!-- Список чатов -->
    <div id="chat-list" class="flex-1 overflow-y-auto custom-scrollbar">
      <div class="px-2 py-1">
        <div class="flex items-center gap-3 p-2.5 rounded-xl bg-brand-500/10 border border-brand-500/20 cursor-pointer">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=group&backgroundColor=6366f1" class="w-12 h-12 rounded-full border border-zinc-700">
          <div class="flex-1 min-w-0">
            <h3 class="font-semibold text-zinc-100 truncate text-[15px]">Команда Разработки</h3>
            <p class="text-sm text-brand-300 truncate">Алексей: Сервер обновлен 🚀</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Профиль пользователя -->
    <div class="p-3 glass-panel border-t border-zinc-800/80 flex items-center justify-between">
      <div class="flex items-center gap-3 overflow-hidden p-1.5 rounded-lg flex-1">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=me&backgroundColor=3f3f46" class="w-9 h-9 rounded-full border border-zinc-700">
        <div class="flex flex-col min-w-0">
          <span class="font-medium text-sm text-zinc-200 truncate">Max Developer</span>
          <span class="text-xs text-emerald-400 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>В сети</span>
        </div>
      </div>
      <!-- Кнопка "Настройки" -->
      <button onclick="openModal('settings-modal')" class="p-2 text-zinc-400 hover:text-zinc-100 transition rounded-full hover:bg-zinc-800">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </aside>

  <!-- Основная зона чата -->
  <main class="flex-1 flex flex-col h-full relative bg-zinc-950 bg-chat-pattern">
    <header class="h-16 px-4 border-b border-zinc-800/80 glass-panel flex items-center justify-between z-10">
      <div class="flex items-center gap-4">
        <button id="menu-btn" class="md:hidden p-2 -ml-2 rounded-full text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 transition">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <div class="flex items-center gap-3">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=group&backgroundColor=6366f1" class="w-10 h-10 rounded-full border border-zinc-800">
          <div class="flex flex-col">
            <h2 class="font-semibold text-zinc-100 leading-tight">Команда Разработки</h2>
            <span class="text-xs text-zinc-400 font-medium">12 участников, 3 онлайн</span>
          </div>
        </div>
      </div>
    </header>

    <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-5 custom-scrollbar flex flex-col"></div>

    <footer class="p-3 glass-panel border-t border-zinc-800/80">
      <form id="message-form" class="max-w-5xl mx-auto flex items-end gap-2 relative">
        <div class="flex-1 relative bg-zinc-900/80 rounded-2xl border border-zinc-700/50 flex items-end">
          <textarea id="message-input" rows="1" placeholder="Введите сообщение..." class="w-full bg-transparent text-zinc-100 px-4 py-3 max-h-32 focus:outline-none text-[15px] resize-none"></textarea>
        </div>
        <button type="submit" id="send-btn" class="w-12 h-12 flex items-center justify-center bg-brand-600 hover:bg-brand-500 text-white rounded-full transition-all shrink-0">
          <i class="fa-solid fa-paper-plane text-lg ml-[-2px]"></i>
        </button>
      </form>
    </footer>
  </main>

  <!-- ================= МОДАЛЬНЫЕ ОКНА ================= -->
  
  <!-- Обертка для всех модальных окон (темный фон) -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4 transition-opacity opacity-0" onclick="closeAllModals(event)">
    
    <!-- 1. Настройки профиля -->
    <div id="settings-modal" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
      <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-900/50">
        <h2 class="text-lg font-semibold text-zinc-100">Настройки</h2>
        <button onclick="closeAllModals()" class="text-zinc-500 hover:text-zinc-300 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="p-6 space-y-6">
        <div class="flex items-center gap-4">
          <div class="relative group cursor-pointer">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=me&backgroundColor=3f3f46" class="w-20 h-20 rounded-full border border-zinc-700">
            <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-camera text-white"></i></div>
          </div>
          <div class="flex-1">
            <label class="text-xs text-zinc-400 font-medium mb-1 block">Имя пользователя</label>
            <input type="text" value="Max Developer" class="w-full bg-zinc-950 text-zinc-100 px-3 py-2 rounded-lg border border-zinc-700 focus:outline-none focus:border-brand-500 transition">
          </div>
        </div>
        <div class="space-y-2">
          <label class="text-xs text-zinc-400 font-medium block">О себе</label>
          <textarea class="w-full bg-zinc-950 text-zinc-100 px-3 py-2 rounded-lg border border-zinc-700 focus:outline-none focus:border-brand-500 transition resize-none h-20" placeholder="Расскажите о себе..."></textarea>
        </div>
        <div class="flex items-center justify-between p-3 bg-zinc-950 rounded-lg border border-zinc-800">
          <span class="text-sm font-medium text-zinc-200">Уведомления</span>
          <div class="w-10 h-5 bg-brand-500 rounded-full relative cursor-pointer"><div class="w-4 h-4 bg-white rounded-full absolute top-0.5 right-0.5 shadow"></div></div>
        </div>
        <button onclick="saveSettings()" class="w-full py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-medium transition shadow-lg shadow-brand-500/20">Сохранить изменения</button>
      </div>
    </div>

    <!-- 2. Добавление друга -->
    <div id="add-friend-modal" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
      <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-900/50">
        <h2 class="text-lg font-semibold text-zinc-100">Добавить контакт</h2>
        <button onclick="closeAllModals()" class="text-zinc-500 hover:text-zinc-300 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="p-6 space-y-4">
        <p class="text-sm text-zinc-400">Введите ID или имя пользователя, чтобы найти его в Nexus.</p>
        <div class="relative">
          <i class="fa-solid fa-at absolute left-3 top-3 text-zinc-500 text-sm"></i>
          <input type="text" id="friend-search-input" placeholder="username" class="w-full bg-zinc-950 text-zinc-100 pl-9 pr-4 py-2.5 rounded-xl border border-zinc-700 focus:outline-none focus:border-brand-500 transition">
        </div>
        
        <!-- Имитация результата поиска -->
        <div id="search-result" class="hidden p-3 bg-zinc-950 border border-zinc-800 rounded-xl flex items-center justify-between mt-4">
          <div class="flex items-center gap-3">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=viktor&backgroundColor=10b981" class="w-10 h-10 rounded-full">
            <div>
              <p class="text-sm font-medium text-zinc-100">Виктор</p>
              <p class="text-xs text-zinc-500">Был недавно</p>
            </div>
          </div>
          <button onclick="addFriendSuccess()" class="px-3 py-1.5 bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-white rounded-lg text-xs font-semibold transition">Добавить</button>
        </div>

        <button onclick="simulateSearch()" class="w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded-xl font-medium transition mt-2 border border-zinc-700">Найти пользователя</button>
      </div>
    </div>

  </div>

  <script>
    // --- Логика модальных окон ---
    const backdrop = document.getElementById('modal-backdrop');
    
    function openModal(modalId) {
      // Скрываем все модалки
      document.getElementById('settings-modal').classList.add('hidden');
      document.getElementById('add-friend-modal').classList.add('hidden');
      
      // Показываем фон и нужную модалку
      backdrop.classList.remove('hidden');
      document.getElementById(modalId).classList.remove('hidden');
      
      // Запускаем анимацию
      requestAnimationFrame(() => {
        backdrop.style.opacity = '1';
        document.getElementById(modalId).classList.add('modal-enter');
        document.getElementById(modalId).classList.remove('modal-exit');
      });
    }

    function closeAllModals(event) {
      if (event && event.target !== backdrop) return; // Закрывать только при клике на фон или крестик
      
      const activeModal = document.querySelector('#modal-backdrop > div:not(.hidden)');
      if (activeModal) {
        activeModal.classList.remove('modal-enter');
        activeModal.classList.add('modal-exit');
      }
      
      backdrop.style.opacity = '0';
      setTimeout(() => {
        backdrop.classList.add('hidden');
        document.getElementById('search-result').classList.add('hidden'); // Сброс поиска
        document.getElementById('friend-search-input').value = '';
      }, 200); // Ждем окончания анимации
    }

    // Имитация поиска друга
    function simulateSearch() {
      const input = document.getElementById('friend-search-input').value;
      if(input.length > 2) {
        const btn = event.target;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Ищем...';
        setTimeout(() => {
          btn.innerHTML = 'Найти пользователя';
          document.getElementById('search-result').classList.remove('hidden');
        }, 800);
      }
    }

    function addFriendSuccess() {
      alert("Пользователь добавлен в список контактов!");
      closeAllModals();
    }

    function saveSettings() {
      alert("Настройки успешно сохранены!");
      closeAllModals();
    }

    // --- Базовая логика чата (осталась прежней) ---
    const messagesContainer = document.getElementById('messages-container');
    function renderMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex justify-end msg-enter w-full`;
      msgDiv.innerHTML = `
        <div class="max-w-[85%] bg-gradient-to-br from-brand-600 to-brand-500 text-white rounded-2xl rounded-br-sm p-2.5 shadow-md">
          <p class="text-[15px]">${text}</p>
          <div class="text-right mt-1"><span class="text-[10px] text-white/80">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>
        </div>`;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    document.getElementById('message-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('message-input').value.trim();
      if (!text) return;
      renderMessage(text);
      document.getElementById('message-input').value = '';
    });
  </script>
</body>
</html>
