<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Web Clone</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            telegram: {
              bg: '#0f172a',
              sidebar: '#1e293b',
              chatBg: '#0f172a',
              bubbleSent: '#2563eb',
              bubbleReceived: '#334155',
              accent: '#3b82f6',
              hover: '#334155',
              textMuted: '#94a3b8',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.7);
    }
    
    .chat-item {
      transition: background-color 0.15s ease-in-out;
    }
    
    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-message {
      animation: messageAppear 0.2s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    .tg-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* Custom Themes */
    .theme-gradient {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%) !important;
    }
    .theme-space {
      background: linear-gradient(to bottom, #050515, #0a0a25) !important;
    }
    .theme-classic {
      background-color: #0f172a !important;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'telegram-app-ru';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "demo-key",
          authDomain: "demo.firebaseapp.com",
          projectId: "demo-project",
          storageBucket: "demo.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:demo"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.tgFirebase = { app, auth, db, appId, signInAnonymously, doc, setDoc, getDoc, collection, onSnapshot, addDoc };
  </script>
</head>
<body class="font-sans antialiased bg-slate-900 text-slate-100 h-screen overflow-hidden flex select-none dark:bg-slate-950 dark:text-slate-100">

  <div id="app" class="flex w-full h-full relative">
    
    <!-- LEFT SIDEBAR -->
    <aside id="sidebar" class="w-full md:w-80 lg:w-96 flex-shrink-0 bg-slate-800 dark:bg-slate-900 border-r border-slate-700/50 flex flex-col h-full z-20 transition-all duration-300">
      
      <!-- Sidebar Header -->
      <div class="p-3 bg-slate-800 dark:bg-slate-900 flex items-center justify-between border-b border-slate-700/40">
        <button id="menuBtn" class="p-2 text-slate-400 hover:text-white rounded-full hover:bg-slate-700/50 transition" title="Настройки оформления">
          <i class="fa-solid fa-palette text-lg"></i>
        </button>
        
        <!-- Search Input -->
        <div class="relative flex-1 mx-2">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="searchInput"
            placeholder="Поиск чатов..." 
            class="w-full pl-9 pr-8 py-1.5 bg-slate-700/60 dark:bg-slate-800 text-slate-100 text-sm rounded-full border border-transparent focus:border-blue-500 focus:outline-none placeholder-slate-400"
          >
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Add Real-Time Chat Button -->
        <button id="addChatBtn" class="p-2 text-blue-400 hover:text-blue-300 rounded-full hover:bg-slate-700/50 transition" title="Создать чат / Группу / Канал">
          <i class="fa-solid fa-plus text-lg"></i>
        </button>

        <!-- Theme Toggle Button -->
        <button id="themeToggleBtn" class="p-2 text-slate-400 hover:text-white rounded-full hover:bg-slate-700/50 transition" title="Переключить тему">
          <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
        </button>
      </div>

      <!-- User ID Banner -->
      <div class="bg-blue-900/30 border-b border-blue-500/20 px-3 py-2 flex items-center justify-between text-xs text-blue-200">
        <div class="truncate">
          <span class="text-slate-400">Ваш ID:</span>
          <span id="myUserIdDisplay" class="font-mono font-bold text-white ml-1">подключение...</span>
        </div>
        <button id="copyMyIdBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded text-[10px] transition flex items-center gap-1">
          <i class="fa-regular fa-copy"></i> Скопировать ID
        </button>
      </div>

      <!-- Chat Filter Tabs / Folders -->
      <div id="folderTabs" class="flex text-xs font-semibold border-b border-slate-700/40 px-2 pt-1 text-slate-400 bg-slate-800/80 dark:bg-slate-900/80 overflow-x-auto no-scrollbar">
        <button data-folder="all" class="folder-tab px-3 py-2 text-blue-400 border-b-2 border-blue-500 font-medium text-center whitespace-nowrap">Все</button>
        <button data-folder="personal" class="folder-tab px-3 py-2 hover:text-slate-200 text-center transition whitespace-nowrap">Личные</button>
        <button data-folder="work" class="folder-tab px-3 py-2 hover:text-slate-200 text-center transition whitespace-nowrap">Работа</button>
        <button data-folder="bots" class="folder-tab px-3 py-2 hover:text-slate-200 text-center transition whitespace-nowrap">Боты</button>
      </div>

      <div id="chatList" class="flex-1 overflow-y-auto divide-y divide-slate-800/30">
        <!-- Chats will be rendered dynamically -->
      </div>
    </aside>

    <!-- RIGHT CHAT AREA -->
    <main id="chatArea" class="flex-1 flex flex-col h-full bg-slate-900 dark:bg-slate-950 relative tg-pattern hidden md:flex">
      
      <header id="chatHeader" class="h-16 px-4 bg-slate-800/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-700/50 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3 cursor-pointer">
          <button id="backToSidebarBtn" class="md:hidden p-2 text-slate-400 hover:text-white rounded-full">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          
          <div class="relative">
            <img id="headerAvatar" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=80" class="w-10 h-10 rounded-full object-cover border border-slate-600">
            <span id="headerOnlineBadge" class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-800 rounded-full hidden"></span>
          </div>
          <div>
            <h2 id="headerName" class="font-semibold text-slate-100 text-sm md:text-base leading-tight">Выберите чат</h2>
            <p id="headerStatus" class="text-xs text-slate-400">Выберите диалог из списка слева</p>
          </div>
        </div>

        <div class="flex items-center space-x-1 md:space-x-2 text-slate-400">
          <button id="chatSearchBtn" class="p-2.5 hover:text-white rounded-full hover:bg-slate-700/50 transition" title="Поиск в чате">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <button id="audioCallBtn" class="p-2.5 hover:text-white rounded-full hover:bg-slate-700/50 transition" title="Аудиозвонок">
            <i class="fa-solid fa-phone"></i>
          </button>
          <button id="videoCallBtn" class="p-2.5 hover:text-white rounded-full hover:bg-slate-700/50 transition" title="Видеозвонок">
            <i class="fa-solid fa-video"></i>
          </button>
        </div>
      </header>

      <!-- Pinned Message Banner -->
      <div id="pinnedBanner" class="hidden bg-slate-800/90 border-b border-slate-700/60 px-4 py-2 flex items-center justify-between text-xs text-slate-300 backdrop-blur z-10">
        <div class="flex items-center gap-2 overflow-hidden">
          <i class="fa-solid fa-thumbtack text-blue-400"></i>
          <div class="truncate">
            <span class="font-semibold text-blue-400">Закрепленное сообщение:</span>
            <span id="pinnedText" class="ml-1 text-slate-200">...</span>
          </div>
        </div>
        <button id="unpinBtn" class="text-slate-400 hover:text-white ml-2"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Messages Container -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-slate-500 text-center p-4">
          <div class="w-20 h-20 bg-slate-800/80 rounded-full flex items-center justify-center mb-3 text-3xl text-blue-400">
            <i class="fa-regular fa-paper-plane"></i>
          </div>
          <p class="font-medium text-slate-300">Выберите диалог, чтобы начать общение</p>
          <p class="text-xs text-slate-500 mt-1">Или нажмите «+» сверху, чтобы добавить нового собеседника или бота</p>
        </div>
      </div>

      <!-- Emoji & Reactions Picker Panel -->
      <div id="emojiPicker" class="hidden absolute bottom-20 left-4 z-30 p-3 bg-slate-800 border border-slate-700 rounded-2xl shadow-xl w-72 grid grid-cols-6 gap-2 text-xl max-h-48 overflow-y-auto">
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">😀</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">😂</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">🔥</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">❤️</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">👍</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">🚀</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">😎</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">🎉</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">🙌</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">💯</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">🤔</button>
        <button class="emoji-btn hover:bg-slate-700 rounded p-1">✨</button>
      </div>

      <!-- File Attachment Input -->
      <input type="file" id="fileAttachmentInput" class="hidden" accept="image/*,video/*,audio/*,.pdf,.doc,.zip">

      <!-- Chat Footer Input -->
      <footer id="inputBar" class="p-3 bg-slate-800/90 dark:bg-slate-900/90 border-t border-slate-700/50 flex items-center space-x-2 z-10">
        <button id="emojiBtn" class="p-2.5 text-slate-400 hover:text-blue-400 rounded-full hover:bg-slate-700/50 transition">
          <i class="fa-regular fa-face-smile text-xl"></i>
        </button>

        <button id="attachBtn" class="p-2.5 text-slate-400 hover:text-blue-400 rounded-full hover:bg-slate-700/50 transition" title="Отправить фото или файл">
          <i class="fa-solid fa-paperclip text-xl"></i>
        </button>

        <div class="flex-1 relative flex items-center">
          <input 
            type="text" 
            id="messageInput"
            placeholder="Написать сообщение..." 
            class="w-full py-2.5 px-4 bg-slate-700/50 dark:bg-slate-800 text-slate-100 placeholder-slate-400 rounded-2xl border border-transparent focus:border-blue-500 focus:outline-none text-sm"
            autocomplete="off"
          >
        </div>

        <button id="micBtn" class="p-3 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-full transition shadow-md flex items-center justify-center w-11 h-11" title="Записать голосовое сообщение">
          <i class="fa-solid fa-microphone text-base"></i>
        </button>

        <button id="sendBtn" class="p-3 bg-blue-600 hover:bg-blue-500 text-white rounded-full transition shadow-md flex items-center justify-center w-11 h-11 hidden">
          <i class="fa-solid fa-paper-plane text-base"></i>
        </button>
      </footer>
    </main>
  </div>

  <!-- CALL INTERFACE MODAL -->
  <div id="callModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-between p-8 text-white">
    <div class="text-center mt-10">
      <h3 id="callUserName" class="text-2xl font-bold">Собеседник</h3>
      <p id="callStatusText" class="text-blue-400 text-sm mt-1 animate-pulse">Звонок...</p>
    </div>

    <div class="relative flex items-center justify-center">
      <div class="absolute w-48 h-48 bg-blue-500/20 rounded-full animate-ping"></div>
      <img id="callUserAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="w-32 h-32 rounded-full object-cover border-4 border-blue-500 z-10 shadow-2xl">
    </div>

    <div class="flex items-center space-x-6 mb-10">
      <button id="muteCallBtn" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-full text-xl w-14 h-14 flex items-center justify-center transition">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button id="endCallBtn" class="p-4 bg-red-600 hover:bg-red-500 rounded-full text-xl w-16 h-16 flex items-center justify-center transition shadow-lg">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
      <button id="videoToggleCallBtn" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-full text-xl w-14 h-14 flex items-center justify-center transition">
        <i class="fa-solid fa-video"></i>
      </button>
    </div>
  </div>

  <!-- CREATE CHAT MODAL -->
  <div id="addChatModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-2"><i class="fa-solid fa-plus text-blue-400 mr-2"></i>Создать диалог или группу</h3>
      
      <div class="space-y-4 my-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Тип:</label>
          <select id="chatTypeSelect" class="w-full px-3 py-2 bg-slate-700 text-white rounded-lg border border-slate-600 focus:outline-none text-sm">
            <option value="user">Личный чат по ID</option>
            <option value="group">Групповой чат</option>
            <option value="channel">Канал</option>
            <option value="secret">🔒 Секретный чат</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Название / ID пользователя:</label>
          <input type="text" id="targetUserIdInput" placeholder="Введите имя или ID..." class="w-full px-3 py-2 bg-slate-700 text-white rounded-lg border border-slate-600 focus:border-blue-500 focus:outline-none text-sm">
        </div>
      </div>

      <div class="flex justify-end space-x-3">
        <button id="cancelModalBtn" class="px-4 py-2 rounded-xl text-slate-400 hover:bg-slate-700 text-sm font-medium transition">Отмена</button>
        <button id="confirmAddChatBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium transition">Создать</button>
      </div>
    </div>
  </div>

  <!-- THEME CUSTOMIZATION MODAL -->
  <div id="themeModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-palette text-blue-400 mr-2"></i>Оформление чата</h3>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-2">Выбор фонового стиля:</label>
          <div class="grid grid-cols-3 gap-2">
            <button data-theme="classic" class="theme-select-btn p-3 bg-slate-900 border border-slate-600 rounded-xl text-xs text-center text-white">Классика</button>
            <button data-theme="gradient" class="theme-select-btn p-3 bg-gradient-to-r from-purple-900 to-indigo-900 border border-slate-600 rounded-xl text-xs text-center text-white">Градиент</button>
            <button data-theme="space" class="theme-select-btn p-3 bg-black border border-slate-600 rounded-xl text-xs text-center text-white">Космос</button>
          </div>
        </div>
      </div>

      <div class="flex justify-end mt-6">
        <button id="closeThemeModalBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium transition">Готово</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed top-5 right-5 bg-blue-600 text-white px-4 py-2.5 rounded-xl shadow-xl z-50 text-sm flex items-center gap-2">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">Сообщение</span>
  </div>

  <script>
    // Initial Pre-populated Chats with AI Assistant
    const initialChats = [
      {
        id: "ai-assistant",
        name: "🤖 AI Ассистент",
        avatar: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=80",
        verified: true,
        online: true,
        unread: 1,
        folder: "bots",
        statusText: "умный бот 24/7",
        isReal: false,
        isAi: true,
        messages: [
          { id: 1, text: "Привет! Я встроенный AI-помощник. Задавай любые вопросы!", time: "10:00", sent: false }
        ]
      },
      {
        id: "bot-1",
        name: "Служба Telegram",
        avatar: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=80",
        verified: true,
        online: true,
        unread: 0,
        folder: "personal",
        statusText: "Служебные уведомления",
        isReal: false,
        messages: [
          { id: 101, text: "Добро пожаловать в Telegram Web!", time: "10:01", sent: false }
        ]
      },
      {
        id: "bot-2",
        name: "Алексей Смирнов",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80",
        verified: false,
        online: true,
        unread: 0,
        folder: "work",
        statusText: "в сети",
        isReal: false,
        messages: [
          { id: 201, text: "Привет! Напиши, как освободишься 🚀", time: "11:20", sent: false }
        ]
      }
    ];

    let chats = [...initialChats];
    let activeChatId = null;
    let activeFolder = "all";
    let isDarkMode = true;
    let myUserId = "user-" + Math.random().toString(36).substr(2, 6);
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // DOM Elements
    const chatListEl = document.getElementById('chatList');
    const messagesContainerEl = document.getElementById('messagesContainer');
    const emptyStateEl = document.getElementById('emptyState');
    const headerAvatar = document.getElementById('headerAvatar');
    const headerName = document.getElementById('headerName');
    const headerStatus = document.getElementById('headerStatus');
    const headerOnlineBadge = document.getElementById('headerOnlineBadge');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const emojiBtn = document.getElementById('emojiBtn');
    const emojiPicker = document.getElementById('emojiPicker');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const sidebar = document.getElementById('sidebar');
    const chatArea = document.getElementById('chatArea');
    const backToSidebarBtn = document.getElementById('backToSidebarBtn');
    const myUserIdDisplay = document.getElementById('myUserIdDisplay');
    const copyMyIdBtn = document.getElementById('copyMyIdBtn');
    const addChatBtn = document.getElementById('addChatBtn');
    const addChatModal = document.getElementById('addChatModal');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const confirmAddChatBtn = document.getElementById('confirmAddChatBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileAttachmentInput = document.getElementById('fileAttachmentInput');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const menuBtn = document.getElementById('menuBtn');
    const themeModal = document.getElementById('themeModal');
    const closeThemeModalBtn = document.getElementById('closeThemeModalBtn');
    const callModal = document.getElementById('callModal');
    const endCallBtn = document.getElementById('endCallBtn');
    const audioCallBtn = document.getElementById('audioCallBtn');
    const videoCallBtn = document.getElementById('videoCallBtn');

    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function getCurrentTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function renderChatList(filterQuery = '') {
      chatListEl.innerHTML = '';
      
      const filtered = chats.filter(chat => {
        const matchesQuery = chat.name.toLowerCase().includes(filterQuery.toLowerCase());
        const matchesFolder = activeFolder === "all" || chat.folder === activeFolder;
        return matchesQuery && matchesFolder;
      });

      filtered.forEach(chat => {
        const lastMsg = chat.messages[chat.messages.length - 1];
        const lastMsgText = lastMsg ? lastMsg.text : "Сообщений нет";
        const lastMsgTime = lastMsg ? lastMsg.time : "";

        const isActive = chat.id === activeChatId;

        const chatItem = document.createElement('div');
        chatItem.className = `chat-item flex items-center space-x-3 p-3 cursor-pointer select-none transition ${
          isActive ? 'bg-slate-700/70 dark:bg-slate-800' : 'hover:bg-slate-700/30 dark:hover:bg-slate-800/40'
        }`;
        
        chatItem.onclick = () => selectChat(chat.id);

        chatItem.innerHTML = `
          <div class="relative flex-shrink-0">
            <img src="${chat.avatar}" class="w-12 h-12 rounded-full object-cover">
            ${chat.online ? '<span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-slate-800 rounded-full"></span>' : ''}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline mb-0.5">
              <h3 class="font-medium text-slate-100 text-sm truncate flex items-center gap-1">
                ${chat.name}
                ${chat.verified ? '<i class="fa-solid fa-circle-check text-blue-500 text-xs"></i>' : ''}
              </h3>
              <span class="text-[11px] text-slate-400 flex-shrink-0">${lastMsgTime}</span>
            </div>
            <div class="flex justify-between items-center text-xs text-slate-400">
              <p class="truncate pr-2">${lastMsgText}</p>
              ${chat.unread > 0 ? `<span class="bg-blue-600 text-white font-semibold text-[10px] px-2 py-0.5 rounded-full flex-shrink-0">${chat.unread}</span>` : ''}
            </div>
          </div>
        `;

        chatListEl.appendChild(chatItem);
      });
    }

    function selectChat(id) {
      activeChatId = id;
      const chat = chats.find(c => c.id === id);
      if (!chat) return;

      chat.unread = 0;

      headerName.innerHTML = `${chat.name} ${chat.verified ? '<i class="fa-solid fa-circle-check text-blue-500 text-xs ml-1"></i>' : ''}`;
      headerAvatar.src = chat.avatar;
      headerStatus.innerText = chat.statusText;
      if (chat.online) {
        headerOnlineBadge.classList.remove('hidden');
      } else {
        headerOnlineBadge.classList.add('hidden');
      }

      emptyStateEl.classList.add('hidden');

      if (window.innerWidth < 768) {
        sidebar.classList.add('hidden');
        chatArea.classList.remove('hidden');
      }

      renderChatList(searchInput.value);
      renderMessages();
    }

    function renderMessages() {
      if (!activeChatId) return;

      const chat = chats.find(c => c.id === activeChatId);
      if (!chat) return;

      messagesContainerEl.innerHTML = '';

      chat.messages.forEach(msg => {
        const bubbleWrap = document.createElement('div');
        bubbleWrap.className = `flex flex-col ${msg.sent ? 'items-end' : 'items-start'} animate-message`;

        const bubble = document.createElement('div');
        bubble.className = `max-w-[80%] md:max-w-[65%] rounded-2xl px-3.5 py-2 relative text-sm text-slate-100 shadow-sm ${
          msg.sent 
            ? 'bg-blue-600 rounded-tr-none' 
            : 'bg-slate-700/80 dark:bg-slate-800 rounded-tl-none border border-slate-700/50'
        }`;

        let content = `<p class="break-words leading-relaxed">${msg.text}</p>`;

        if (msg.image) {
          content = `<img src="${msg.image}" class="rounded-lg max-h-60 w-full object-cover mb-2">${content}`;
        }

        if (msg.audio) {
          content = `
            <div class="flex items-center gap-2 my-1">
              <audio controls src="${msg.audio}" class="h-8 w-48"></audio>
            </div>
          `;
        }

        bubble.innerHTML = `
          ${content}
          <div class="flex items-center justify-end space-x-1 mt-1 text-[10px] opacity-75">
            <span>${msg.time}</span>
            ${msg.sent ? '<i class="fa-solid fa-check-double text-[11px] text-blue-200"></i>' : ''}
          </div>
        `;

        bubbleWrap.appendChild(bubble);
        messagesContainerEl.appendChild(bubbleWrap);
      });

      messagesContainerEl.scrollTop = messagesContainerEl.scrollHeight;
    }

    function sendMessage(customData = null) {
      const text = customData ? customData.text : messageInput.value.trim();
      if ((!text && !customData) || !activeChatId) return;

      const chat = chats.find(c => c.id === activeChatId);
      if (!chat) return;

      const timeNow = getCurrentTime();
      const newMsg = {
        id: Date.now(),
        text: text || '',
        time: timeNow,
        sent: true,
        image: customData ? customData.image : null,
        audio: customData ? customData.audio : null
      };

      chat.messages.push(newMsg);
      messageInput.value = '';
      sendBtn.classList.add('hidden');
      micBtn.classList.remove('hidden');

      renderMessages();
      renderChatList(searchInput.value);

      if (chat.isAi) {
        triggerAiReply(chat, text);
      }
    }

    function triggerAiReply(chat, userPrompt) {
      setTimeout(() => {
        headerStatus.innerText = "печатает...";
        headerStatus.classList.add('text-blue-400', 'animate-pulse');
      }, 500);

      setTimeout(() => {
        const aiReplies = [
          `Насчет "${userPrompt}" — это отличный вопрос! Мессенджер работает на ура.`,
          `Я проанализировал ваш запрос. Готов помочь с дальнейшей настройкой!`,
          `Отличный тест! Приложение поддерживает голосовые, звонки и отправку картинок.`
        ];
        const replyText = aiReplies[Math.floor(Math.random() * aiReplies.length)];

        chat.messages.push({
          id: Date.now(),
          text: replyText,
          time: getCurrentTime(),
          sent: false
        });

        headerStatus.innerText = "умный бот 24/7";
        headerStatus.classList.remove('text-blue-400', 'animate-pulse');
        renderMessages();
        renderChatList(searchInput.value);
      }, 1800);
    }

    // Toggle Mic / Send Button
    messageInput.addEventListener('input', () => {
      const hasText = messageInput.value.trim().length > 0;
      sendBtn.classList.toggle('hidden', !hasText);
      micBtn.classList.toggle('hidden', hasText);
    });

    sendBtn.addEventListener('click', () => sendMessage());

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Real Microphone Recording
    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            const audioUrl = URL.createObjectURL(audioBlob);
            sendMessage({ text: '🎤 Голосовое сообщение', audio: audioUrl });
          };

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add('bg-red-600', 'animate-pulse');
          showToast("Запись голоса... Нажмите еще раз для отправки.");
        } catch (err) {
          showToast("Ошибка доступа к микрофону");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('bg-red-600', 'animate-pulse');
      }
    });

    // Attach Image
    attachBtn.addEventListener('click', () => fileAttachmentInput.click());
    fileAttachmentInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          sendMessage({ text: file.name, image: event.target.result });
        };
        reader.readAsDataURL(file);
      }
    });

    // Folder Navigation
    document.querySelectorAll('.folder-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.folder-tab').forEach(t => {
          t.classList.remove('text-blue-400', 'border-b-2', 'border-blue-500');
        });
        tab.classList.add('text-blue-400', 'border-b-2', 'border-blue-500');
        activeFolder = tab.dataset.folder;
        renderChatList(searchInput.value);
      });
    });

    // Calls Handling
    audioCallBtn.addEventListener('click', () => openCallModal("Аудиозвонок"));
    videoCallBtn.addEventListener('click', () => openCallModal("Видеозвонок"));

    function openCallModal(type) {
      if (!activeChatId) return;
      const chat = chats.find(c => c.id === activeChatId);
      document.getElementById('callUserName').innerText = chat.name;
      document.getElementById('callUserAvatar').src = chat.avatar;
      document.getElementById('callStatusText').innerText = `${type}...`;
      callModal.classList.remove('hidden');
    }

    endCallBtn.addEventListener('click', () => callModal.classList.add('hidden'));

    // Theme Customization
    menuBtn.addEventListener('click', () => themeModal.classList.remove('hidden'));
    closeThemeModalBtn.addEventListener('click', () => themeModal.classList.add('hidden'));

    document.querySelectorAll('.theme-select-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        chatArea.classList.remove('theme-classic', 'theme-gradient', 'theme-space');
        chatArea.classList.add(`theme-${btn.dataset.theme}`);
        showToast("Тема оформления обновлена!");
      });
    });

    // Modals & Misc
    addChatBtn.addEventListener('click', () => addChatModal.classList.remove('hidden'));
    cancelModalBtn.addEventListener('click', () => addChatModal.classList.add('hidden'));

    confirmAddChatBtn.addEventListener('click', () => {
      const name = document.getElementById('targetUserIdInput').value.trim();
      if (!name) return;

      const newChat = {
        id: "chat-" + Date.now(),
        name: name,
        avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80",
        verified: false,
        online: true,
        unread: 0,
        folder: "personal",
        statusText: "в сети",
        isReal: false,
        messages: [{ id: Date.now(), text: "Чат создан!", time: getCurrentTime(), sent: true }]
      };

      chats.unshift(newChat);
      addChatModal.classList.add('hidden');
      document.getElementById('targetUserIdInput').value = '';
      selectChat(newChat.id);
    });

    copyMyIdBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(myUserId);
      showToast("ID скопирован в буфер обмена!");
    });

    themeToggleBtn.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      document.documentElement.classList.toggle('dark', isDarkMode);
    });

    backToSidebarBtn.addEventListener('click', () => {
      chatArea.classList.add('hidden');
      sidebar.classList.remove('hidden');
    });

    window.addEventListener('load', () => {
      myUserIdDisplay.innerText = myUserId;
      renderChatList();
    });
  </script>
</body>
</html>
